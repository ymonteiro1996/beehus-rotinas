{% extends "base.html" %}
{% set active = "impostos" %}
{% block title %}Impostos{% endblock %}

{% block head %}
<style>
  .step-num { display: inline-flex; align-items: center; justify-content: center;
              width: 20px; height: 20px; border-radius: 50%; background: #f97316; color: white;
              font-size: 10px; font-weight: 700; flex-shrink: 0; }
  #sec-table th { position: sticky; top: 0; background: #f9fafb; z-index: 2; }
</style>
{% endblock %}

{% block content %}

<header class="bg-white shadow px-6 py-3 flex items-center justify-between sticky top-0 z-10">
  <h1 class="font-semibold text-gray-700">Impostos</h1>
</header>

<div class="px-6 pt-5 pb-8 space-y-4">

  <!-- ══ STEP 1 — Select Company + Wallet ════════════════════════════════════ -->
  <div class="bg-white rounded-xl shadow p-5">
    <div class="flex items-center gap-2 mb-4">
      <span class="step-num">1</span>
      <p class="text-xs font-semibold text-gray-700">Selecionar Carteira</p>
    </div>

    <div class="flex flex-wrap items-end gap-3">
      <div class="min-w-[160px]">
        <label class="block text-[10px] text-gray-400 mb-1">Empresa</label>
        <select id="company-select" onchange="onCompanyChange()"
          class="w-full border rounded-lg px-3 py-2 text-xs bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-400">
          <option value="">— selecione —</option>
        </select>
      </div>
      <div class="min-w-[160px]">
        <label class="block text-[10px] text-gray-400 mb-1">Carteira</label>
        <select id="wallet-select"
          class="w-full border rounded-lg px-3 py-2 text-xs bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-400">
          <option value="">— selecione —</option>
        </select>
      </div>
      <button onclick="loadSecurities()"
        class="bg-orange-500 hover:bg-orange-600 text-white rounded-lg px-5 py-2 text-xs font-semibold whitespace-nowrap">
        Carregar
      </button>
      <span id="wallet-id-label" class="text-[10px] text-gray-400 font-mono"></span>
    </div>
  </div>

  <!-- ══ STEP 2 — Securities + Tax Table ═════════════════════════════════════ -->
  <div id="results-section" class="hidden bg-white rounded-xl shadow overflow-hidden">
    <div class="px-5 py-3 border-b flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="step-num">2</span>
        <p class="text-xs font-semibold text-gray-700">Ativos da Carteira</p>
        <span id="sec-count" class="text-[10px] text-gray-400"></span>
        <span id="position-date" class="text-[10px] font-mono text-orange-600 bg-orange-50 border border-orange-200 rounded px-2 py-0.5"></span>
      </div>
      <button onclick="copyResults()"
        class="flex items-center gap-1.5 border rounded-lg px-3 py-1.5 text-[10px] text-gray-600 hover:bg-gray-50">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        Copiar
      </button>
    </div>
    <div class="overflow-auto" style="max-height:65vh;">
      <table id="sec-table" class="w-max min-w-full text-xs" style="border-collapse:separate;border-spacing:0;">
        <thead class="bg-gray-50 text-gray-500 uppercase text-[10px]">
          <tr id="sec-thead"></tr>
        </thead>
        <tbody id="sec-tbody"></tbody>
        <tfoot id="sec-tfoot" class="bg-gray-50 font-semibold"></tfoot>
      </table>
    </div>
  </div>

</div>

{% endblock %}

{% block modals %}
<script>
  let _lastData = null;

  function escHtml(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function fmtNum(v, d = 2) {
    return v == null ? "—" : Number(v).toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d});
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  loadCompanies();

  function loadCompanies() {
    fetch("/api/impostos/companies").then(r => r.json()).then(companies => {
      const sel = document.getElementById("company-select");
      sel.innerHTML = '<option value="">— selecione —</option>' +
        companies.map(c => `<option value="${escHtml(c.id)}">${escHtml(c.name)}</option>`).join("");
    });
  }

  function onCompanyChange() {
    const cid  = document.getElementById("company-select").value;
    const wSel = document.getElementById("wallet-select");
    if (!cid) { wSel.innerHTML = '<option value="">— selecione —</option>'; return; }
    wSel.innerHTML = '<option value="">Carregando...</option>';
    fetch(`/api/impostos/wallets?companyId=${encodeURIComponent(cid)}`)
      .then(r => r.json())
      .then(wallets => {
        wSel.innerHTML = wallets.length
          ? wallets.map(w => `<option value="${escHtml(w.id)}">${escHtml(w.name)}</option>`).join("")
          : '<option value="">Nenhuma carteira</option>';
      });
  }

  // ── Load Securities ────────────────────────────────────────────────────────
  function loadSecurities() {
    const wSel     = document.getElementById("wallet-select");
    const walletId = wSel.value;
    if (!walletId) { alert("Selecione uma carteira."); return; }
    document.getElementById("wallet-id-label").textContent = walletId;

    fetch(`/api/impostos/wallet-securities?walletId=${encodeURIComponent(walletId)}`)
      .then(r => r.json())
      .then(data => {
        _lastData = data;
        renderTable(data);
      })
      .catch(() => alert("Erro ao carregar ativos."));
  }

  function renderTable(data) {
    const secs = data.securities || [];
    const posDate = data.positionDate || "";

    document.getElementById("sec-count").textContent = `(${secs.length} ativo${secs.length !== 1 ? "s" : ""})`;
    document.getElementById("position-date").textContent = posDate ? `Posição: ${posDate}` : "";

    document.getElementById("sec-thead").innerHTML =
      `<th class="px-3 py-2.5 text-left">Ativo</th>
       <th class="px-3 py-2.5 text-left">Tipo</th>
       <th class="px-3 py-2.5 text-left">Indexador</th>
       <th class="px-3 py-2.5 text-left">Tipo Precif.</th>
       <th class="px-3 py-2.5 text-right">Vencimento</th>
       <th class="px-3 py-2.5 text-right">Quantidade</th>
       <th class="px-3 py-2.5 text-right">PU</th>
       <th class="px-3 py-2.5 text-right">Saldo Bruto</th>
       <th class="px-3 py-2.5 text-right">Imposto</th>
       <th class="px-3 py-2.5 text-right text-orange-600">Saldo Líquido</th>`;

    const totalBalance = secs.reduce((s, r) => s + (r.balance || 0), 0);
    const totalTax     = secs.reduce((s, r) => s + (r.tax || 0), 0);
    const totalNet     = secs.reduce((s, r) => s + (r.netBalance || r.balance || 0), 0);

    document.getElementById("sec-tbody").innerHTML = secs.map(r =>
      `<tr class="border-t border-gray-100 hover:bg-gray-50">
        <td class="px-3 py-2">
          <p class="font-medium text-gray-800">${escHtml(r.beehusName)}</p>
          <p class="text-[10px] text-gray-400 font-mono">${escHtml(r.mainId || r.securityId)}</p>
        </td>
        <td class="px-3 py-2 text-gray-500">${escHtml(r.securityType || "—")}</td>
        <td class="px-3 py-2 text-gray-500">${escHtml(r.indexer || "—")}</td>
        <td class="px-3 py-2 text-gray-500">${escHtml(r.pricingType || "—")}</td>
        <td class="px-3 py-2 text-right font-mono text-gray-500">${escHtml(r.maturityDate || "—")}</td>
        <td class="px-3 py-2 text-right font-mono text-gray-600">${fmtNum(r.quantity, 2)}</td>
        <td class="px-3 py-2 text-right font-mono text-gray-600">${fmtNum(r.pu, 8)}</td>
        <td class="px-3 py-2 text-right font-mono text-gray-600">${fmtNum(r.balance, 2)}</td>
        <td class="px-3 py-2 text-right font-mono text-gray-500">${r.tax != null ? fmtNum(r.tax, 2) : '<span class="text-gray-300 italic">pendente</span>'}</td>
        <td class="px-3 py-2 text-right font-mono font-semibold text-orange-600">${r.netBalance != null ? fmtNum(r.netBalance, 2) : '<span class="text-gray-300 italic">pendente</span>'}</td>
      </tr>`
    ).join("");

    document.getElementById("sec-tfoot").innerHTML =
      `<tr class="border-t-2 border-gray-300">
        <td class="px-3 py-2.5 font-semibold text-gray-700" colspan="7">Total</td>
        <td class="px-3 py-2.5 text-right font-mono font-semibold text-gray-700">${fmtNum(totalBalance, 2)}</td>
        <td class="px-3 py-2.5 text-right font-mono font-semibold text-gray-500">${totalTax ? fmtNum(totalTax, 2) : '—'}</td>
        <td class="px-3 py-2.5 text-right font-mono font-semibold text-orange-600">${totalNet ? fmtNum(totalNet, 2) : '—'}</td>
      </tr>`;

    document.getElementById("results-section").classList.remove("hidden");
  }

  // ── Copy ───────────────────────────────────────────────────────────────────
  function copyResults() {
    if (!_lastData) return;
    const fmtBR = v => v == null || v === "" ? "" : String(v).replace(".", ",");
    const headers = ["Ativo", "mainId", "Tipo", "Indexador", "Tipo Precif.", "Vencimento", "Quantidade", "PU", "Saldo Bruto", "Imposto", "Saldo Líquido"];
    const rows = (_lastData.securities || []).map(r => [
      r.beehusName, r.mainId || r.securityId, r.securityType || "", r.indexer || "",
      r.pricingType || "", r.maturityDate || "",
      fmtBR(r.quantity), fmtBR(r.pu), fmtBR(r.balance),
      r.tax != null ? fmtBR(r.tax) : "", r.netBalance != null ? fmtBR(r.netBalance) : "",
    ]);
    const tsv = [headers, ...rows].map(r => r.join("\t")).join("\n");
    navigator.clipboard.writeText(tsv).then(() => {
      const btn = document.querySelector("[onclick='copyResults()']");
      const orig = btn.innerHTML; btn.textContent = "Copiado!";
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    });
  }
</script>
{% endblock %}
